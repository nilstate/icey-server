name: icey-server

services:
  icey-server:
    build:
      context: ../..
      dockerfile: icey-server/docker/Dockerfile
      args:
        ICEY_SERVER_BINARY: ${ICEY_SERVER_BINARY:-icey-server/build-dev/src/server/icey-server}
    image: icey/icey-server:local
    container_name: icey-server
    network_mode: host
    restart: unless-stopped
    environment:
      ICEY_HOST: ${ICEY_HOST:-0.0.0.0}
      ICEY_MODE: ${ICEY_MODE:-stream}
      ICEY_LOOP: ${ICEY_LOOP:-auto}
      ICEY_PORT: ${ICEY_PORT:-4500}
      ICEY_TURN_PORT: ${ICEY_TURN_PORT:-3478}
      ICEY_TURN_EXTERNAL_IP: ${ICEY_TURN_EXTERNAL_IP:-}
      ICEY_TURN_SECRET: ${ICEY_TURN_SECRET:-}
      ICEY_AUTH_TOKEN: ${ICEY_AUTH_TOKEN:-}
      ICEY_SOURCE: ${ICEY_SOURCE:-/app/media/test.mp4}
      ICEY_RECORD_DIR: ${ICEY_RECORD_DIR:-/app/recordings}
    volumes:
      - ./recordings:/app/recordings
    healthcheck:
      # $$ defers expansion to the container shell so the configured port is used.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${ICEY_PORT:-4500}/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
